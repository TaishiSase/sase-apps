<!DOCTYPE html>
<html lang="ja">
<head>
<script src="/family-account.js"></script>
<link rel="stylesheet" href="/family-shared.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="佐瀬家アプリ">
  <meta name="theme-color" content="#f6f5f0">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>佐瀬家アプリ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div class="page">
 <header class="hero"><div><p class="eyebrow" id="homeDate"></p><h1>本日の佐瀬家</h1><p class="hero-sub">予定も、思い出も。ここから。</p></div><span class="home-symbol" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" focusable="false"><path d="M8 21 24 8l16 13v18a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3Z" fill="currentColor" opacity=".09"/><path d="M5 22 22.1 8.1a3 3 0 0 1 3.8 0L43 22M10 20v19a3 3 0 0 0 3 3h22a3 3 0 0 0 3-3V20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 32s-7-4.1-7-8a3.8 3.8 0 0 1 7-2 3.8 3.8 0 0 1 7 2c0 3.9-7 8-7 8Z" fill="currentColor"/></svg></span></header>
 <main id="homePanel">
  <section class="today-panel"><div class="section-heading"><h2>今日の予定</h2><button id="refreshHome" type="button">更新</button></div><div id="todayContent" aria-live="polite">読み込み中…</div></section>
  <div class="quick-actions"><a href="https://sase-apps.vercel.app/calendar/?action=add">＋ 予定を追加</a><a href="https://sase-apps.vercel.app/muscle/?action=start">▶ 筋トレを開始</a></div>
  <section class="dashboard"><div class="section-heading"><h2>家族のダッシュボード</h2><span id="updateStatus" role="status"></span></div>
   <details class="display-settings"><summary>表示する情報を選ぶ</summary><p>この端末だけに反映されます。</p><div class="display-options">
    <label><input type="checkbox" data-card="card-muscle" checked>パパの筋トレ</label>
    <label><input type="checkbox" data-card="card-camp" checked>次のキャンプ</label>
    <label><input type="checkbox" data-card="card-topics" checked>話し合いたいこと</label>
    <label><input type="checkbox" data-card="card-photo" checked>最新のことね</label>
    <label><input type="checkbox" data-card="card-age" checked>ことねの成長</label>
    <label><input type="checkbox" data-card="card-last-camp" checked>前回のキャンプ</label>
   </div><p id="displayStatus" role="status"></p></details>
   <div class="dash-grid">
   <section class="dash-card card-yotei"><div class="section-heading"><h3>今週の予定</h3><a href="https://sase-apps.vercel.app/calendar/">すべて見る →</a></div><div id="yoteiContent">読み込み中…</div></section>
   <a class="dash-card card-muscle" href="https://sase-apps.vercel.app/muscle/"><h3>パパの筋トレ</h3><div id="muscleContent">読み込み中…</div><span class="card-cta">記録を開く →</span></a>
   <a class="dash-card card-camp" id="cardCamp" href="https://sase-apps.vercel.app/camp/"><h3>次のキャンプ</h3><div id="campContent">読み込み中…</div><span class="card-cta">準備を確認 →</span></a>
   <section class="dash-card card-topics"><div class="section-heading"><h3>話し合いたいこと</h3><a href="https://sase-apps.vercel.app/talk/">開く →</a></div><div id="topicsContent">読み込み中…</div></section>
   <a class="dash-card card-photo" id="cardPhoto" href="https://sase-apps.vercel.app/photo/"><h3 class="dash-card-label">最新のことね</h3><div class="photo-content" id="photoContent">読み込み中…</div></a>
   <div class="dash-card card-age"><h3>ことねの成長</h3><div class="age-display"><span class="age-num" id="ageYears">—</span>歳 <span class="age-num" id="ageMonths">—</span>ヶ月</div><p id="ageDays"></p></div>
   <a class="dash-card card-last-camp" href="https://sase-apps.vercel.app/camp/"><h3>前回のキャンプ</h3><div id="campLastContent">読み込み中…</div></a>
  </div></section>
 </main>
 <section id="appsPanel" hidden><div class="section-heading"><h2>家族のアプリ</h2></div><div class="app-grid" id="appGrid"></div></section>
 <footer class="footer">家族の毎日を、少し心地よく。</footer>
</div>
<nav class="home-nav" aria-label="メインメニュー">
 <a href="#home" data-panel="home" aria-current="page"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7M5 9v11h5v-6h4v6h5V9"/></svg><span>ホーム</span></a>
 <a href="https://sase-apps.vercel.app/calendar/"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16m-12 4h2m4 0h2m-8 3h2"/></svg><span>予定</span></a>
 <a href="#apps" data-panel="apps"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>アプリ</span></a>
</nav>
<script>
    // ===== アプリ一覧 =====
    var APPS = [
      {
        icon: '/icons/photo.svg',
        name:       '今日のことちゃん',
        desc:       '娘の成長アルバム。毎日1枚の写真と短いコメントで記録。',
        url:        'https://sase-apps.vercel.app/photo/',
        color: '#986776',
        colorLight: '#f2e5e9'
      },
      {
        icon: '/icons/talk.svg',
        name:       'こんや話そ',
        desc:       'ふたりの話し合いノート。いつか話したいことをメモして解決へ。',
        url:        'https://sase-apps.vercel.app/talk/',
        color: '#94723f',
        colorLight: '#f3ecdd'
      },
      {
        icon: '/icons/camp.svg',
        name:       'ふぁみキャン△',
        desc:       'キャンプの計画・記録帳。メンバー・料理・買い出し・写真をまとめて管理。',
        url:        'https://sase-apps.vercel.app/camp/',
        color: '#51745c',
        colorLight: '#e5eddf'
      },
      {
        icon: '/icons/calendar.svg',
        name:       '夫婦の共有予定帳',
        desc:       'パパ・ママ・琴音の予定を一目で共有。月・週カレンダーで管理。',
        url:        'https://sase-apps.vercel.app/calendar/',
        color: '#4f7588',
        colorLight: '#e5edf0'
      },
      {
        icon: '/icons/muscle.svg',
        name:       'パパの筋トレ記録',
        desc:       'トレーニングをカレンダーで管理。種目・重量・回数・体組成を記録。',
        url:        'https://sase-apps.vercel.app/muscle/',
        color: '#716080',
        colorLight: '#ede7f1'
      },
      {
        icon: '/icons/startup.svg',
        name:       '嫁ちゃん起業奮闘記',
        desc:       '家族の未来を少しずつ形にする新しいアプリ置き場。Hagumi「きょう、なにしよう。」を開発中。',
        url:        'yomechan-startup/',
        color: '#768047',
        colorLight: '#edf0df'
      }
      ,{name:'佐瀬家のお買いもの',desc:'買うものをふたりで共有。買ったらチェック、あとから編集も。',url:'/shopping',icon:'/icons/shopping.svg',color:'#51745c',colorLight:'#e5eddf'},
      {name:'週末どこ行く？',desc:'気になる場所を保存して、次のお出かけの予定へ。',url:'/outings',icon:'/icons/outings.svg',color:'#94723f',colorLight:'#f3ecdd'}
    ];

    function renderApps() {
      var grid = document.getElementById('appGrid');
      [APPS[3], APPS[4], APPS[2], APPS[1], APPS[0], APPS[6], APPS[7], APPS[5]].forEach(function(app) {
        var card = document.createElement('a');
        card.href      = app.url;
        card.target    = '_self';
        card.rel       = 'noopener noreferrer';
        card.className = 'app-card';
        card.innerHTML =
          '<div class="card-icon-wrap" style="background:' + app.colorLight + '">' +
            '<img src="'+app.icon+'" width="30" height="30" alt="" aria-hidden="true">' +
          '</div>' +
          '<div class="card-body">' +
            '<h2 class="card-name">' + app.name + '</h2>' +
            '<p class="card-desc">' + app.desc + '</p>' +
          '</div>' +
          '<div class="card-arrow" style="color:' + app.color + '">→</div>';
        grid.appendChild(card);
      });
    }

    // ===== ダッシュボード =====
    var db = null;
    var BIRTHDAY = new Date('2024-02-19T00:00:00');

    function esc(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // 年齢計算
    function calcAge(now) {
      now = now || new Date();
      var totalMonths = (now.getFullYear()-BIRTHDAY.getFullYear())*12+now.getMonth()-BIRTHDAY.getMonth();
      if (now.getDate() < BIRTHDAY.getDate()) totalMonths--;
      var days = Math.floor((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-Date.UTC(2024,1,19))/86400000);
      return {years:Math.floor(totalMonths/12), months:totalMonths%12, days:days};
    }

    function renderAge() {
      var age = calcAge();
      document.getElementById('ageYears').textContent  = age.years;
      document.getElementById('ageMonths').textContent = age.months;
      document.getElementById('ageDays').textContent   = '生後 ' + age.days.toLocaleString() + ' 日目';
    }

    // 最新写真
    async function loadLatestPhoto() {
      var el = document.getElementById('photoContent');
      try {
        var r = await db
          .from('posts')
          .select('post_date, image_url, comment')
          .order('post_date', { ascending: false })
          .limit(1)
          .maybeSingle();

        if (r.error) throw r.error;
        if (!r.data) {
          el.innerHTML = '<div class="dash-empty-photo">📷 まだ写真がありません</div>';
          return;
        }

        var d       = new Date(r.data.post_date + 'T00:00:00');
        var dateStr = d.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });

        el.innerHTML =
          '<img src="' + r.data.image_url + '" class="photo-img" alt="最新のことね" loading="lazy">' +
          '<div class="photo-overlay">' +
            '<span class="photo-date">' + dateStr + '</span>' +
            '<span class="photo-comment">「' + esc(r.data.comment) + '」</span>' +
          '</div>';

      } catch (e) {
        el.innerHTML = '<div class="dash-empty-photo">読み込みエラー</div>';
      }
    }

    // 次のキャンプ
    async function loadNextCamp() {
      var el = document.getElementById('campContent');
      try {
        var r = await db
          .from('camps')
          .select('id, title, campsite_name, start_date, end_date, camp_members(name)')
          .eq('status', 'planned')
          .or('start_date.gte.'+yoteiDateStr(new Date())+',end_date.gte.'+yoteiDateStr(new Date())+',start_date.is.null')
          .order('start_date', { ascending: true, nullsFirst: false })
          .limit(1)
          .maybeSingle();

        if (r.error) throw r.error;
        if (!r.data) {
          el.innerHTML = '<div class="camp-empty">⛺ 予定なし</div>';
          return;
        }

        var c = r.data;
        document.getElementById("cardCamp").href = "https://sase-apps.vercel.app/camp/?camp=" + encodeURIComponent(c.id);
        var dateStr = '';
        if (c.start_date) {
          var d = new Date(c.start_date + 'T00:00:00');
          dateStr = d.toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' });
          if (c.end_date && c.end_date !== c.start_date) {
            var d2 = new Date(c.end_date + 'T00:00:00');
            dateStr += ' 〜 ' + d2.toLocaleDateString('ja-JP', { month: 'long', day: 'numeric' });
          }
        }
        var members = (c.camp_members || []).map(function(m) { return m.name; }).join('・');

        el.innerHTML =
          '<div class="camp-next-title">' + esc(c.title) + '</div>' +
          (c.campsite_name ? '<div class="camp-next-site">📍 ' + esc(c.campsite_name) + '</div>' : '') +
          (dateStr ? '<div class="camp-next-date">📅 ' + dateStr + '</div>' : '') +
          (members ? '<div class="camp-next-members">👥 ' + esc(members) + '</div>' : '');

      } catch (e) {
        el.innerHTML = '<div class="camp-empty">読み込みエラー</div>';
      }
    }

    // 前回のキャンプ
    async function loadLastCamp() {
      var el = document.getElementById('campLastContent');
      try {
        var r = await db
          .from('camps')
          .select('title, campsite_name, start_date, end_date, rating')
          .eq('status', 'completed')
          .order('start_date', { ascending: false })
          .limit(1)
          .maybeSingle();

        if (r.error) throw r.error;
        if (!r.data) {
          el.innerHTML = '<div class="camp-empty">まだ記録がありません</div>';
          return;
        }

        var c = r.data;
        var dateStr = '';
        if (c.start_date) {
          var d = new Date(c.start_date + 'T00:00:00');
          dateStr = d.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });
          if (c.end_date && c.end_date !== c.start_date) {
            var d2 = new Date(c.end_date + 'T00:00:00');
            var nights = Math.round((new Date(c.end_date) - new Date(c.start_date)) / 86400000);
            dateStr += '（' + nights + '泊）';
          }
        }
        var stars = c.rating ? '⭐'.repeat(c.rating) : '';

        el.innerHTML =
          '<div class="camp-last-title">' + esc(c.title) + '</div>' +
          (c.campsite_name ? '<div class="camp-last-meta">📍 ' + esc(c.campsite_name) + '</div>' : '') +
          (dateStr ? '<div class="camp-last-meta">📅 ' + dateStr + '</div>' : '') +
          (stars ? '<div class="camp-last-stars">' + stars + '</div>' : '');

      } catch (e) {
        el.innerHTML = '<div class="camp-empty">読み込みエラー</div>';
      }
    }

    // 話し合いトピック
    async function loadTopics() {
      var el = document.getElementById('topicsContent');
      try {
        var r = await db
          .from('topics')
          .select('id, title, priority')
          .eq('is_resolved', false)
          .order('created_at', { ascending: false });

        if (r.error) throw r.error;
        var data = (r.data || []).sort(function(a, b) {
          if (a.priority === 'urgent' && b.priority !== 'urgent') return -1;
          if (b.priority === 'urgent' && a.priority !== 'urgent') return 1;
          return 0;
        });

        if (data.length === 0) {
          el.innerHTML = '<p class="dash-empty">話し合い待ちはありません 👍</p>';
          return;
        }

        var html = '<div class="topics-count">' + data.length + ' 件 話し合い待ち</div>';
        data.slice(0, 4).forEach(function(t) {
          html +=
            '<a class="topic-row" href="https://sase-apps.vercel.app/talk/?topic=' + encodeURIComponent(t.id) + '">' +
              (t.priority === 'urgent'
                ? '<span class="topic-dot urgent">🔥</span>'
                : '<span class="topic-dot">·</span>') +
              '<span class="topic-text">' + esc(t.title) + '</span>' +
            '</a>';
        });
        if (data.length > 4) {
          html += '<div class="topics-more">他 ' + (data.length - 4) + ' 件…</div>';
        }
        el.innerHTML = html;

      } catch (e) {
        el.innerHTML = '<p class="dash-empty">読み込みエラー</p>';
      }
    }

    // 今週の予定
    var YOTEI_MEMBERS = {
      papa:   { label: 'パパ',  color: '#5BA3D0' },
      mama:   { label: 'ママ',  color: '#E8748A' },
      kotone: { label: '琴音',  color: '#67B899' },
    };
    var YOTEI_DAYS_JA = ['日', '月', '火', '水', '木', '金', '土'];

    function yoteiDateStr(d) {
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    function yoteiFormatDate(s) {
      var p = s.split('-');
      var d = new Date(+p[0], +p[1] - 1, +p[2]);
      return (d.getMonth() + 1) + '/' + d.getDate() + '（' + YOTEI_DAYS_JA[d.getDay()] + '）';
    }

    function scheduleRows(data) {
      return data.map(function(s) {
        var member=Object.prototype.hasOwnProperty.call(YOTEI_MEMBERS,s.member)?s.member:'everyone';
        var m=YOTEI_MEMBERS[member] || {label:'みんな'};
        var label=s.event_type==='custom' ? s.event_label || '予定' : s.event_type;
        return '<a class="yotei-row" href="https://sase-apps.vercel.app/calendar/?date='+encodeURIComponent(s.date)+'&schedule='+encodeURIComponent(s.id)+'"><span class="yotei-date">'+yoteiFormatDate(s.date)+'</span><span class="yotei-member" data-member="'+member+'">'+esc(m.label)+'</span><span class="yotei-label">'+esc(label)+'</span><span class="yotei-check">'+(s.confirmed?'確認済み':'確認待ち')+'</span><span class="yotei-sub">'+(s.time_start?esc(s.time_start.slice(0,5))+'　':'')+(s.return_time?'帰宅 '+esc(s.return_time.slice(0,5))+'　':'')+(s.needs_dinner===true?'夕食あり':s.needs_dinner===false?'夕食なし':'')+'</span></a>';
      }).join('');
    }
    async function loadYotei() {
      var el=document.getElementById('yoteiContent'), todayEl=document.getElementById('todayContent');
      try {
        var today=yoteiDateStr(new Date()), end=new Date(); end.setDate(end.getDate()+6);
        var r=await db.from('schedules').select('id,date,date_end,member,event_type,event_label,time_start,confirmed,return_time,needs_dinner').is('is_private',null).lte('date',yoteiDateStr(end)).or('date.gte.'+today+',date_end.gte.'+today).order('date').order('time_start');
        if(r.error) throw r.error;
        var data=r.data || [], current=data.filter(function(s){return s.date<=today && (s.date_end || s.date)>=today;});
        todayEl.innerHTML=current.length?scheduleRows(current):'<p class="empty">今日は登録された予定がありません。</p>';
        el.innerHTML=data.length?scheduleRows(data.slice(0,7))+(data.length>7?'<p class="topics-more">ほか '+(data.length-7)+' 件 · すべて見るから確認</p>':''):'<p class="empty">今週の予定はまだありません。</p>';
      } catch(e) { el.innerHTML='<p class="empty">予定を読み込めませんでした。上の「更新」で再試行できます。</p>'; todayEl.innerHTML=el.innerHTML; }
    }
    async function loadMuscle() {
      var el=document.getElementById('muscleContent');
      try {
        var r=await db.from('workout_sessions').select('date').order('date',{ascending:false}).limit(1).maybeSingle();
        if(r.error) throw r.error;
        el.innerHTML=r.data?'<p class="metric">前回 '+yoteiFormatDate(r.data.date)+'</p><p class="empty">今日の記録を続けましょう。</p>':'<p class="empty">最初のトレーニングを記録しましょう。</p>';
      } catch(e) {el.innerHTML='<p class="empty">記録を読み込めませんでした。</p>';}
    }
    var homeRefreshing=false, homeLastRefresh=0, homeDay='';
    async function refreshHome() {
      if(homeRefreshing || !db) return;
      var now=new Date();
      document.getElementById('homeDate').textContent=now.toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'long'});
      renderAge();
      if(!navigator.onLine) {
        document.getElementById('updateStatus').textContent='オフライン · 再接続すると更新します';
        return;
      }
      homeRefreshing=true;
      homeDay=yoteiDateStr(now);
      var button=document.getElementById('refreshHome'); button.disabled=true;button.textContent='更新中';
      try {
        await Promise.allSettled([loadLatestPhoto(),loadTopics(),loadNextCamp(),loadLastCamp(),loadYotei(),loadMuscle()]);
        homeLastRefresh=Date.now();
        document.getElementById('updateStatus').textContent='最終取得 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
      } finally {
        homeRefreshing=false;button.disabled=false;button.textContent='更新';
      }
    }
    function refreshHomeIfNeeded(force) {
      if(document.visibilityState==='hidden' || !db) return;
      if(force===true || homeDay!==yoteiDateStr(new Date()) || Date.now()-homeLastRefresh>=60000) refreshHome();
    }
    function setupHomeRefresh() {
      document.addEventListener('visibilitychange',function(){refreshHomeIfNeeded();});
      window.addEventListener('pageshow',function(){refreshHomeIfNeeded();});
      window.addEventListener('online',function(){refreshHomeIfNeeded(true);});
      window.addEventListener('offline',function(){document.getElementById('updateStatus').textContent='オフライン · 再接続すると更新します';});
      // 開いたまま日付が変わった場合だけ更新。通常の定期通信は行わない。
      setInterval(function(){if(homeDay!==yoteiDateStr(new Date())) refreshHomeIfNeeded();},60000);
    }
    function showPanel() {
      var apps=location.hash==='#apps';
      document.getElementById('homePanel').hidden=apps;document.getElementById('appsPanel').hidden=!apps;
      document.querySelectorAll('[data-panel]').forEach(function(a){if((a.dataset.panel==='apps')===apps)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
    }
    function setupDisplaySettings() {
      var saved = {};
      try { saved = JSON.parse(localStorage.getItem('sase-home-display-v1') || '{}') || {}; } catch (e) {}
      var inputs = document.querySelectorAll('[data-card]');
      function apply() {
        inputs.forEach(function(input) {
          document.querySelector('.' + input.dataset.card).hidden = !input.checked;
        });
      }
      inputs.forEach(function(input) {
        input.checked = saved[input.dataset.card] !== false;
        input.addEventListener('change', function() {
          apply();
          var settings = {};
          inputs.forEach(function(item) { settings[item.dataset.card] = item.checked; });
          try {
            localStorage.setItem('sase-home-display-v1', JSON.stringify(settings));
            document.getElementById('displayStatus').textContent = '表示設定を保存しました';
          } catch (e) {
            document.getElementById('displayStatus').textContent = 'この画面には反映しました。端末への保存はできませんでした。';
          }
        });
      });
      apply();
    }
    // 初期化
    async function init() {
      renderApps();
      renderAge();
      setupDisplaySettings();
      showPanel();
      document.getElementById("homeDate").textContent=new Date().toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"long"});
      window.addEventListener("hashchange",showPanel);
      document.getElementById("refreshHome").addEventListener("click",refreshHome);

      try {
        var res = await fetch('config.json');
        var cfg = await res.json();
        db = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
 if(!(await FamilyAccount.requireSession(db)))return;
      } catch (e) {
        console.error('Config init error:', e);
        document.getElementById('photoContent').innerHTML  = '<div class="dash-empty-photo">接続エラー</div>';
        document.getElementById('topicsContent').innerHTML = '<p class="dash-empty">接続エラー</p>';
        document.getElementById('yoteiContent').innerHTML  = '<p class="dash-empty">接続エラー</p>';
        ["todayContent","muscleContent","campContent","campLastContent"].forEach(function(id){document.getElementById(id).textContent="接続できませんでした。ページを再読み込みしてください。";});
        document.getElementById("refreshHome").onclick=function(){location.reload();};
        return;
      }

      setupHomeRefresh();
      await refreshHome();
    }

    init();
  </script>
</body>
</html>
