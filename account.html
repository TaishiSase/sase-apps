<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>佐瀬家のログイン</title><link rel="stylesheet" href="/home.css"><link rel="stylesheet" href="/family-shared.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/dist/umd/supabase.js"></script><script src="/family-account.js"></script></head><body><main class="family-page"><p class="eyebrow">SASE FAMILY</p><h1>おかえりなさい。</h1><p class="intro">一度ログインすれば、家族のアプリをそのまま使えます。</p><section id="loginPanel" class="panel" hidden><form id="loginForm"><div class="account-options"><button type="button" data-member="papa" aria-pressed="false">パパ</button><button type="button" data-member="mama" aria-pressed="false">ママ</button></div><label>暗証番号<input class="pin" id="pinInput" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required autocomplete="current-password"></label><button class="primary" id="loginSubmit">ログイン</button></form><button id="passkeyLogin" hidden>Face ID・パスキーでログイン</button></section><section id="signedPanel" class="panel" hidden><h2 id="signedName"></h2><div class="actions"><a class="button-link" id="continueLink" href="/">アプリへ進む</a><button id="registerPasskey" hidden>Face ID・パスキーを登録</button><button id="signout">アカウントを切り替える</button></div><p id="passkeyHelp" class="small"></p></section><p id="accountStatus" class="status" role="status" aria-live="polite">接続しています…</p></main><script src="/account.js"></script></body></html>
